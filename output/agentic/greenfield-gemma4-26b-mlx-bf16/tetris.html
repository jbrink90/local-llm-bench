<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Tetris</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-color: #16213e;
            --text-color: #e94560;
            --accent-color: #0f3460;
        }

        body {
            background: var(--bg-color);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: row;
            gap: 30px;
            padding: 30px;
            background: var(--panel-color);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        canvas {
            border: 4px solid #fff;
            background-color: #000;
            border-radius: 5px;
            display: block;
        }

        #side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 140px;
        }

        .stat-box {
            background: var(--accent-color);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .stat-label {
            font-size: 0.75em;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.6em;
            font-weight: bold;
            color: #fff;
        }

        #next-canvas {
            background: #000;
            border: 2px solid #555;
            border-radius: 5px;
            margin-top: 10px;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            z-index: 10;
        }

        #overlay h2 {
            font-size: 3em;
            color: var(--text-color);
            margin: 0 0 20px 0;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        button {
            padding: 12px 30px;
            font-size: 1.2em;
            cursor: pointer;
            background: var(--text-color);
            border: none;
            color: white;
            border-radius: 50px;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            transform: scale(1.1);
            background: #ff4d6d;
        }

        #controls-hint {
            margin-top: 30px;
            color: #533483;
            font-size: 0.9em;
            text-align: center;
        }

        kbd {
            background: #eee;
            border-radius: 3px;
            border: 1px solid #b4b4b4;
            box-shadow: 0 1px 1px rgba(0, 0, 0, .2), 0 2px 0 0 rgba(255, 255, 255, .7) inset;
            color: #333;
            display: inline-block;
            font-size: .85em;
            font-weight: 700;
            line-height: 1;
            padding: 2px 4px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        
        <div id="side-panel">
            <div>
                <div class="stat-box">
                    <div class="stat-label">Next</div>
                    <canvas id="next-canvas" width="80" height="80"></canvas>
                </div>
                <div class="stat-box" style="margin-top: 15px;">
                    <div class="stat-label">Score</div>
                    <div id="score" class="stat-value">0</div>
                </div>
                <div class="stat-box" style="margin-top: 15px;">
                    <div class="stat-label">Lines</div>
                    <div id="lines" class="stat-value">0</div>
                </div>
            </div>

            <div id="overlay">
                <h2>GAME OVER</h2>
                <button onclick="resetGame()">Play Again</button>
            </div>
        </div>
    </div>

    <div id="controls-hint">
        <kbd>↑</kbd> Rotate &nbsp; <kbd>←</kbd> <kbd>→</kbd> Move &nbsp; <kbd>↓</kbd> Soft Drop
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextContext = nextCanvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const linesElement = document.getElementById('lines');
        const overlay = document.getElementById('overlay');

        context.scale(20, 20);
        nextContext.scale(20, 20);

        const COLORS = [
            null,
            '#00f0f0', // I (Cyan)
            '#f0a000', // L (Orange)
            '#0000f0', // J (Blue)
            '#f0f000', // O (Yellow)
            '#f00000', // Z (Red)
            '#00f000', // S (Green)
            '#a000f0', // T (Purple)
        ];

        const PIECES = {
            'I': [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]],
            'L': [[0, 2, 0], [0, 2, 0], [0, 2, 2]],
            'J': [[0, 3, 0], [0, 3, 0], [3, 3, 0]],
            'O': [[4, 4], [4, 4]],
            'Z': [[5, 5, 0], [0, 5, 5], [0, 0, 0]],
            'S': [[0, 6, 6], [6, 6, 0], [0, 0, 0]],
            'T': [[0, 7, 0], [7, 7, 7], [0, 0, 0]],
        };

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) matrix.push(new Array(w).fill(0));
            return matrix;
        }

        function draw() {
            // Background
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawGrid();
            drawMatrix(arena, {x: 0, y: 0}, context);
            drawMatrix(player.matrix, player.pos, context);
        }

        function drawGrid() {
            context.lineWidth = 0.02;
            context.strokeStyle = '#333';
            for (let x = 0; x < 12; x++) {
                context.beginPath();
                context.moveTo(x, 0);
                context.lineTo(x, 20);
                context.stroke();
            }
            for (let y = 0; y < 20; y++) {
                context.beginPath();
                context.moveTo(0, y);
                context.lineTo(12, y);
                context.stroke();
            }
        }

        function drawMatrix(matrix, offset, ctx) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        const px = x + offset.x;
                        const py = y + offset.y;
                        
                        // Block body
                        ctx.fillStyle = COLORS[value];
                        ctx.fillRect(px, py, 1, 1);

                        // Shine/Bevel effect
                        ctx.lineWidth = 0.05;
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.strokeRect(px, py, 1, 1);
                        
                        // Darker border for definition
                        ctx.lineWidth = 0.03;
                        ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                        ctx.strokeRect(px + 0.02, py + 0.02, 0.96, 0.96);
                    }
                });
            });
        }

        function drawNext() {
            nextContext.fillStyle = '#000';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            if (player.next) {
                // Center the piece in the small canvas
                const matrix = player.next;
                const offX = (4 - matrix[0].length) / 2;
                const offY = (4 - matrix.length) / 2;
                drawMatrix(matrix, {x: offX, y: offY}, nextContext);
            }
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 100;
                player.lines += 1;
                rowCount *= 2;
            }
            updateScore();
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) matrix.forEach(row => row.reverse());
            else matrix.reverse();
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            if (!player.next) {
                player.next = PIECES[pieces[pieces.length * Math.random() | 0]];
            }
            
            player.matrix = player.next;
            const type = Object.keys(PIECES).find(key => PIECES[key] === player.next); // This is a bit hacky but works for finding key
            // Simpler way: 
            // just pick from keys directly in the next step. Let's refactor piece picking.

            player.matrix = player.next;
            // To get the 'type' index correctly, we should store it.
            // But we actually only need the matrix for drawing and collision.
            
            // Re-pick next piece
            const keys = Object.keys(PIECES);
            player.next = PIECES[keys[keys.length * Math.random() | 0]];
            drawNext();

            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                gameOver();
            }
        }

        // Refined piece picking to ensure next works properly
        function getNewPiece() {
            const keys = Object.keys(PIECES);
            return PIECES[keys[keys.length * Math.random() | 0]];
        }

        // Let's replace the playerReset with a better one
        function playerResetCorrected() {
             player.matrix = player.next;
             if (!player.next) {
                 // first time setup handled in init or resetGame
             } else {
                const keys = Object.keys(PIECES);
                player.next = getNewPiece();
                drawNext();
             }

            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                gameOver();
            }
        }

        // Actually, let's just use this simple version:
        function playerResetSimple() {
            const keys = Object.keys(PIECES);
            player.matrix = player.next || getNewPiece();
            player.next = getNewPiece();
            drawNext();

            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            if (collide(arena, player)) {
                gameOver();
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;

        function update(time = 0) {
            if (isGameOver) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function updateScore() {
            scoreElement.innerText = player.score;
            linesElement.innerText = player.lines;
        }

        const arena = createMatrix(12, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            next: null,
            score: 0,
            lines: 0,
        };

        let isGameOver = false;

        function gameOver() {
            isGameOver = true;
            overlay.style.display = 'flex';
        }

        function resetGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.lines = 0;
            player.next = null;
            isGameOver = false;
            overlay.style.display = 'none';
            updateScore();
            playerResetSimple();
            lastTime = performance.now();
            update();
        }

        document.addEventListener('keydown', event => {
            if (isGameOver) return;

            // Left, Right, Down
            if (event.keyCode === 37) {
                playerMove(-1);
            } else if (event.keyCode === 39) {
                playerMove(1);
            } else if (event.keyCode === 40) {
                playerDrop();
            } else if (event.keyCode === 38) { // Up Arrow: Rotate
                playerRotate(1);
            }
        });

        // Initialize
        playerResetSimple();
        updateScore();
        update();

    </script>
</body>
</html>
