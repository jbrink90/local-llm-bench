<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b4e 50%, #26255a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            position: relative;
        }
        
        .game-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 26px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #FFE109, #FF6B6B);
            z-index: -1;
            animation: gradientShift 8s ease infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0 50%; }
            50% { background-position: 100% 50%; }
        }
        
        h1 {
            text-align: center;
            font-size: 3.2rem;
            margin-bottom: 25px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #FFE109);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        
        .main-area {
            display: flex;
            gap: 35px;
        }
        
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .next-piece, .score-display, .level-display, .lines-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .next-piece h3 {
            margin-bottom: 12px;
            font-size: 1.3rem;
            color: #4ecdc4;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .score-display h3, .level-display h3, .lines-display h3 {
            font-size: 1.1rem;
            color: #4ecdc4;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .score-value, .level-value, .lines-value {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(45deg, #FFE109, #FF6B6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .game-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }
        
        #playfield {
            border: 4px solid rgba(78, 205, 196, 0.6);
            border-radius: 12px;
            background: #0a0a12;
            box-shadow: inset 0 0 30px rgba(78, 205, 196, 0.4);
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            padding-top: 30px;
        }
        
        .control-btn {
            background: linear-gradient(145deg, #ff6b6b, #ff5555);
            border: none;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        
        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
        }
        
        .game-over-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .game-over-overlay h2 {
            font-size: 2.5rem;
            color: #ff6b6b;
            margin-bottom: 30px;
            font-weight: 800;
            letter-spacing: 2px;
        }
        
        #restart-btn {
            background: linear-gradient(45deg, #4ecdc4, #3dbeb8);
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        #restart-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.5);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>TETRIS</h1>
        <div class="main-area">
            <div class="left-panel">
                <div class="next-piece">
                    <h3>Next Piece</h3>
                    <canvas id="next-canvas" width="120" height="120"></canvas>
                </div>
                <div class="score-display">
                    <h3>Score</h3>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="level-display">
                    <h3>Level</h3>
                    <div class="level-value" id="level">1</div>
                </div>
                <div class="lines-display">
                    <h3>Lines Cleared</h3>
                    <div class="lines-value" id="lines">0</div>
                </div>
            </div>
            <div class="game-wrapper">
                <canvas id="playfield" width="300" height="600"></canvas>
                <div class="controls">
                    <button class="control-btn" id="move-left-btn">&#8592; Left</button>
                    <button class="control-btn" id="rotate-btn">&#8646; Rotate</button>
                    <button class="control-btn" id="move-right-btn">Right &#8594;</button>
                    <button class="control-btn" id="drop-btn">&#8595; Drop</button>
                </div>
            </div>
        </div>
        <div class="game-over-overlay" id="game-over-overlay">
            <h2>GAME OVER</h2>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <script>
        // Game configuration
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;
        
        // Colors for each piece type - vibrant colors
        const COLORS = [
            '#FF3B3B', // I - Red
            '#00D4FF', // O - Cyan
            '#3DFF3D', // T - Green
            '#FF3DFE', // S - Magenta
            '#FFE109', // Z - Yellow
            '#FF7A00', // J - Orange
            '#6B4CFF'  // L - Purple
        ];
        
        // Piece shapes (tetrominoes)
        const SHAPES = [
            // I
            [[1, 1, 1, 1]],
            // O
            [[1, 1], [1, 1]],
            // T
            [[0, 1, 0], [1, 1, 1]],
            // S
            [[0, 1, 1], [1, 1, 0]],
            // Z
            [[1, 1, 0], [0, 1, 1]],
            // J
            [[1, 0, 0], [1, 1, 1]],
            // L
            [[0, 0, 1], [1, 1, 1]]
        ];
        
        // Game state
        let board = createBoard();
        let score = 0;
        let level = 1;
        let lines = 0;
        let currentPiece = null;
        let nextPiece = null;
        let gameOver = false;
        let lastDropTime = 0;
        
        // Canvas contexts
        const playfieldCtx = document.getElementById('playfield').getContext('2d');
        const nextCtx = document.getElementById('next-canvas').getContext('2d');
        
        // Initialize game board
        function createBoard() {
            return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        }
        
        // Piece class
        class Piece {
            constructor(shape, colorIndex) {
                this.shape = shape;
                this.colorIndex = colorIndex;
                this.x = Math.floor(COLS / 2) - Math.floor(shape[0].length / 2);
                this.y = 0;
            }
            
            rotate() {
                const N = this.shape.length;
                const rotated = Array.from({ length: N }, () => Array(N).fill(0));
                
                for (let y = 0; y < N; y++) {
                    for (let x = 0; x < N; x++) {
                        rotated[x][N - 1 - y] = this.shape[y][x];
                    }
                }
                
                this.shape = rotated;
            }
        }
        
        // Create a new piece
        function getRandomPiece() {
            const shapeIndex = Math.floor(Math.random() * SHAPES.length);
            return new Piece(SHAPES[shapeIndex], shapeIndex);
        }
        
        // Check collision
        function collision(piece, boardX, boardY) {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const newX = boardX + x;
                        const newY = boardY + y;
                        
                        // Check boundaries
                        if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                        if (newY < 0) continue;
                        if (board[newY] && board[newY][newX]) return true;
                    }
                }
            }
            return false;
        }
        
        // Merge piece with board
        function merge(piece) {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const boardY = piece.y + y;
                        const boardX = piece.x + x;
                        if (boardY >= 0) {
                            board[boardY][boardX] = piece.colorIndex + 1;
                        }
                    }
                }
            }
        }
        
        // Clear lines
        function clearLines() {
            let linesCleared = 0;
            
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    y++; // Recheck same row index after shift
                }
            }
            
            if (linesCleared > 0) {
                lines += linesCleared;
                score += Math.pow(100, linesCleared) * level * 100;
                level = Math.floor(lines / 10) + 1;
                updateUI();
            }
        }
        
        // Draw block with 3D effect
        function drawBlock(ctx, x, y, color, blockSize = BLOCK_SIZE) {
            const pixelX = x * blockSize;
            const pixelY = y * blockSize;
            const halfBlock = blockSize / 2;
            
            // Main block
            ctx.fillStyle = color;
            ctx.fillRect(pixelX, pixelY, blockSize, blockSize);
            
            // Top highlight
            const gradientTop = ctx.createLinearGradient(pixelX, pixelY, pixelX, pixelY + halfBlock);
            gradientTop.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
            gradientTop.addColorStop(1, 'rgba(255, 255, 255, 0.1)');
            ctx.fillStyle = gradientTop;
            ctx.fillRect(pixelX, pixelY, blockSize, halfBlock);
            
            // Left highlight
            const gradientLeft = ctx.createLinearGradient(pixelX, pixelY, pixelX + halfBlock, pixelY);
            gradientLeft.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
            gradientLeft.addColorStop(1, 'rgba(255, 255, 255, 0.05)');
            ctx.fillStyle = gradientLeft;
            ctx.fillRect(pixelX, pixelY, halfBlock, blockSize);
            
            // Bottom shadow
            const gradientBottom = ctx.createLinearGradient(pixelX, pixelY + halfBlock, pixelX, pixelY + blockSize);
            gradientBottom.addColorStop(0, 'rgba(0, 0, 0, 0.2)');
            gradientBottom.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
            ctx.fillStyle = gradientBottom;
            ctx.fillRect(pixelX, pixelY + halfBlock, blockSize, halfBlock);
            
            // Right shadow
            const gradientRight = ctx.createLinearGradient(pixelX + halfBlock, pixelY, pixelX + blockSize, pixelY);
            gradientRight.addColorStop(0, 'rgba(0, 0, 0, 0.1)');
            gradientRight.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
            ctx.fillStyle = gradientRight;
            ctx.fillRect(pixelX + halfBlock, pixelY, halfBlock, blockSize);
            
            // Border
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(pixelX, pixelY, blockSize, blockSize);
        }
        
        // Draw board
        function drawBoard() {
            playfieldCtx.clearRect(0, 0, playfield.width, playfield.height);
            
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) {
                        drawBlock(playfieldCtx, x, y, COLORS[board[y][x] - 1]);
                    }
                }
            }
        }
        
        // Draw piece
        function drawPiece(ctx, piece) {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        drawBlock(ctx, piece.x + x, piece.y + y, COLORS[piece.colorIndex]);
                    }
                }
            }
        }
        
        // Draw next piece preview
        function drawNextPiece() {
            nextCtx.clearRect(0, 0, 120, 120);
            
            if (!nextPiece) return;
            
            const blockSize = BLOCK_SIZE / 2;
            const offsetX = (4 - nextPiece.shape[0]) * blockSize / 2 + 6;
            const offsetY = (4 - nextPiece.shape.length) * blockSize / 2 + 6;
            
            for (let y = 0; y < nextPiece.shape.length; y++) {
                for (let x = 0; x < nextPiece.shape[y].length; x++) {
                    if (nextPiece.shape[y][x]) {
                        drawBlock(nextCtx, offsetX + x * blockSize, offsetY + y * blockSize, COLORS[nextPiece.colorIndex], blockSize);
                    }
                }
            }
        }
        
        // Update UI
        function updateUI() {
            document.getElementById('score').textContent = score.toLocaleString();
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }
        
        // Game over check
        function checkGameOver() {
            for (let x = 0; x < COLS; x++) {
                if (board[0][x] !== 0) return true;
            }
            return false;
        }
        
        // Drop piece
        function drop() {
            if (!currentPiece || gameOver) return;
            
            currentPiece.y++;
            
            if (collision(currentPiece, currentPiece.x, currentPiece.y)) {
                currentPiece.y--;
                merge(currentPiece);
                clearLines();
                resetPiece();
            }
        }
        
        // Reset piece
        function resetPiece() {
            currentPiece = nextPiece || getRandomPiece();
            nextPiece = getRandomPiece();
            drawNextPiece();
            
            if (collision(currentPiece, currentPiece.x, currentPiece.y)) {
                gameOver = true;
                document.getElementById('game-over-overlay').classList.add('active');
            }
        }
        
        // Move piece
        function move(dx) {
            if (!currentPiece || gameOver) return;
            
            currentPiece.x += dx;
            if (collision(currentPiece, currentPiece.x, currentPiece.y)) {
                currentPiece.x -= dx;
            }
        }
        
        // Rotate piece with wall kick
        function rotate() {
            if (!currentPiece || gameOver) return;
            
            const originalShape = JSON.parse(JSON.stringify(currentPiece.shape));
            currentPiece.rotate();
            
            // Wall kick - try to move piece if collision detected
            if (collision(currentPiece, currentPiece.x, currentPiece.y)) {
                // Try kicking to the left
                currentPiece.x--;
                if (collision(currentPiece, currentPiece.x, currentPiece.y)) {
                    // Try kicking to the right
                    currentPiece.x += 2;
                    if (collision(currentPiece, currentPiece.x, currentPiece.y)) {
                        // Try kicking down
                        currentPiece.y--;
                        if (collision(currentPiece, currentPiece.x, currentPiece.y)) {
                            currentPiece.shape = originalShape;
                        }
                    }
                }
            }
        }
        
        // Hard drop
        function hardDrop() {
            if (!currentPiece || gameOver) return;
            
            while (!collision(currentPiece, currentPiece.x, currentPiece.y + 1)) {
                currentPiece.y++;
            }
            merge(currentPiece);
            clearLines();
            resetPiece();
        }
        
        // Game loop
        function update(time = 0) {
            if (gameOver) return;
            
            const dropSpeed = Math.max(50, 1000 - (level - 1) * 75);
            
            if (time - lastDropTime > dropSpeed) {
                drop();
                drawBoard();
                if (currentPiece) drawPiece(playfieldCtx, currentPiece);
                lastDropTime = time;
            }
            
            requestAnimationFrame(update);
        }
        
        // Event listeners
        document.addEventListener('keydown', e => {
            if (gameOver) return;
            
            switch (e.key) {
                case 'ArrowLeft':
                    move(-1);
                    break;
                case 'ArrowRight':
                    move(1);
                    break;
                case 'ArrowDown':
                    drop();
                    break;
                case 'ArrowUp':
                    rotate();
                    break;
            }
        });
        
        document.getElementById('move-left-btn').addEventListener('click', () => !gameOver && move(-1));
        document.getElementById('move-right-btn').addEventListener('click', () => !gameOver && move(1));
        document.getElementById('rotate-btn').addEventListener('click', () => !gameOver && rotate());
        document.getElementById('drop-btn').addEventListener('click', () => !gameOver && hardDrop());
        document.getElementById('restart-btn').addEventListener('click', initGame);
        
        // Initialize game
        function initGame() {
            board = createBoard();
            score = 0;
            level = 1;
            lines = 0;
            gameOver = false;
            lastDropTime = 0;
            
            currentPiece = getRandomPiece();
            nextPiece = getRandomPiece();
            
            document.getElementById('game-over-overlay').classList.remove('active');
            updateUI();
            drawBoard();
            requestAnimationFrame(update);
        }
        
        // Start game
        initGame();
    </script>
</body>
</html>
